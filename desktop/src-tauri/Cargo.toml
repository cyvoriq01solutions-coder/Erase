[package]
name = "cyvra-desktop"
version = "0.3.0"
description = "CYVRA Erase Windows customer desktop shell"
authors = ["CYVORIQ Solutions"]
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
name = "cyvra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
cyvra-core = { package = "cyvoriq-erase-agent", path = "../../agent-windows" }
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
serde_json = { version = "=1.0.145" }

[target.'cfg(windows)'.dependencies]
ureq = { version = "=2.12.1", features = ["json", "native-tls"] }
winreg = "=0.52.0"
