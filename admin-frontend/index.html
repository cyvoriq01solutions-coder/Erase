<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>CYVRA Admin Portal</title>

    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #152238; background: #f6f9fc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 640px); padding: 42px; background: #fff; border: 1px solid #dfe7f0; border-top: 4px solid #ee6b00; border-radius: 14px; box-shadow: 0 24px 65px rgba(6, 41, 95, .10); }
    small { color: #ee6b00; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 16px 0 10px; color: #041a3d; font-size: 36px; letter-spacing: -.035em; }
    p { margin: 0; color: #5f6f86; line-height: 1.7; }
    .status { margin-top: 26px; padding: 14px 16px; border-radius: 9px; background: #eef6fc; color: #06295f; font-size: 13px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <small>CYVORIQ INTERNAL SYSTEM</small>
    <h1>CYVRA Admin Portal</h1>
    <p>This isolated administration application is being provisioned. No customer, commercial, licence, activation or management data is exposed by this shell.</p>
    <div class="status">Protected admin application provisioning in progress.</div>
  </main>
</body>
</html>
