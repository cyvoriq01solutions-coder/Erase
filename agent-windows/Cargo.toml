[package]
name = "cyvoriq-erase-agent"
version = "0.2.1"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
name = "cyvra_core"
path = "src/lib.rs"

[[bin]]
name = "cyvra-cli"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "alloc", "rand_core", "fast"] }
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
